# .github/workflows/deploy-pages.yml
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create environment file for build
        run: |
          cat > .env.local << EOF
          # GitHub Pages build environment
          NEXT_PUBLIC_APP_NAME="Coding Agent Template"
          NEXT_PUBLIC_APP_ENV="production"
          NEXT_PUBLIC_GITHUB_PAGES=true
          # External API endpoints for dynamic features
          NEXT_PUBLIC_EXTERNAL_API_URL=https://your-backend-api.com
          NEXT_PUBLIC_GITHUB_REPO_OWNER=your-username
          NEXT_PUBLIC_GITHUB_REPO_NAME=coding-agent-template
          EOF

      - name: Build for GitHub Pages
        run: |
          # Backup original config
          cp next.config.ts next.config.ts.backup 2>/dev/null || cp next.config.js next.config.js.backup 2>/dev/null || true
          
          # Create GitHub Pages adapted config
          cat > next.config.pages.js << 'EOL'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            basePath: '/coding-agent-template', // Adjust this to your repo name
            images: {
              unoptimized: true,
            },
            trailingSlash: true,
            experimental: {
              serverComponentsExternalPackages: [],
            },
            env: {
              NEXT_PUBLIC_GITHUB_PAGES: 'true',
            }
          }

          module.exports = nextConfig
          export default nextConfig
          EOL
          
          # Use the GitHub Pages config for build
          mv next.config.pages.js next.config.js
          
          # Build the application
          pnpm build
          
          # Restore original config
          mv next.config.js.next.backup next.config.js 2>/dev/null || mv next.config.js.backup next.config.js 2>/dev/null || mv next.config.ts.backup next.config.ts 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4