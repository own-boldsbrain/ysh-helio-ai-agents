version: '3.9'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "14268:14268" # Jaeger protocol
      - "14250:14250" # Jaeger protocol
      - "9411:9411"   # Zipkin protocol
    volumes:
      - jaeger_data:/tmp/jaeger
    networks:
      - coding-agent

volumes:
  jaeger_data:
    driver: local

networks:
  coding-agent:
    driver: bridge